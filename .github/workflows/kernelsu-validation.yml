name: KernelSU validation build

on:
  push:
    paths:
      - ".github/workflows/kernelsu-validation.yml"
      - "arch/**"
      - "block/**"
      - "certs/**"
      - "crypto/**"
      - "drivers/**"
      - "fs/**"
      - "include/**"
      - "init/**"
      - "ipc/**"
      - "kernel/**"
      - "lib/**"
      - "mm/**"
      - "net/**"
      - "security/**"
      - "sound/**"
      - "virt/**"
      - "patches/susfs/**"
      - "scripts/dragonkernel/**"
      - "Documentation/dragonkernel/baseline.json"
      - "Kconfig"
      - "Makefile"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: kernelsu-${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: [umi, cmi, cas, thyme, apollo]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set output directory
        run: echo "OUT_ROOT=$RUNNER_TEMP/dragonkernel-out" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: bash scripts/dragonkernel/bootstrap_wsl.sh

      - name: Fetch locked toolchain
        shell: bash
        run: scripts/dragonkernel/prepare_toolchain.sh "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Apply locked SUSFS patches
        run: scripts/dragonkernel/prepare_susfs.sh

      - name: Build KernelSU kernel
        run: scripts/dragonkernel/build_kernelsu.sh "${{ matrix.device }}"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: kernelsu-${{ matrix.device }}-${{ github.sha }}
          path: |
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/.config
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/include/config/kernel.release
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/SHA256SUMS
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/build.log
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/arch/arm64/boot/Image
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/arch/arm64/boot/dts/**/*.dtb
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/arch/arm64/boot/dts/**/*.dtbo
            ${{ env.OUT_ROOT }}/kernelsu/${{ matrix.device }}/**/*.ko
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
