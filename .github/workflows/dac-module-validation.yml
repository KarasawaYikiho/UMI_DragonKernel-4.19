name: DAC module validation

on:
  push:
    paths:
      - ".github/workflows/dac-module-validation.yml"
      - "Documentation/dragonkernel/baseline.json"
      - "scripts/dragonkernel/package_dac_module.py"
      - "scripts/dragonkernel/release_name.py"
      - "scripts/dragonkernel/validate_dac_module.py"
      - "tools/dragon-dac/**"
  pull_request:
    paths:
      - ".github/workflows/dac-module-validation.yml"
      - "Documentation/dragonkernel/baseline.json"
      - "scripts/dragonkernel/package_dac_module.py"
      - "scripts/dragonkernel/release_name.py"
      - "scripts/dragonkernel/validate_dac_module.py"
      - "tools/dragon-dac/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github/workflows/dac-module-validation.yml
            Documentation/dragonkernel/baseline.json
            scripts/dragonkernel/package_dac_module.py
            scripts/dragonkernel/release_name.py
            scripts/dragonkernel/validate_dac_module.py
            tools/dragon-dac
      - name: Host self-test
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            tools/dragon-dac/src/main.cpp -o /tmp/dragon-dac-host
          /tmp/dragon-dac-host --self-test
          python3 scripts/dragonkernel/package_dac_module.py --self-test
          python3 scripts/dragonkernel/validate_dac_module.py --self-test
      - name: Install pinned Android NDK
        run: |
          revision=$(python3 -c 'import json; print(json.load(open("Documentation/dragonkernel/baseline.json"))["userspace_toolchain"]["revision"])')
          test "$revision" = 27.3.13750724
          if [[ ! -d "$ANDROID_SDK_ROOT/ndk/$revision" ]]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$revision"
          fi
      - name: Build arm64 DAC
        run: |
          revision=27.3.13750724
          toolchain="$ANDROID_SDK_ROOT/ndk/$revision/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p out
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          "$toolchain/aarch64-linux-android35-clang++" \
            -std=c++17 -O2 -fPIE -pie -static-libstdc++ \
            -fno-ident -Wl,--build-id=none -Wall -Wextra -Werror \
            tools/dragon-dac/src/main.cpp -o out/dragon-dac
          "$toolchain/llvm-strip" --strip-all out/dragon-dac
          "$toolchain/llvm-readelf" -h out/dragon-dac | grep -q 'AArch64'
          ! "$toolchain/llvm-readelf" -d out/dragon-dac | grep -q 'libc++_shared'
      - name: Package twice and compare
        run: |
          export SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          timestamp=$(TZ=Asia/Shanghai date -d "@$SOURCE_DATE_EPOCH" +%Y%m%d%H%M)
          python3 scripts/dragonkernel/package_dac_module.py \
            --binary out/dragon-dac --output-dir out/a --timestamp "$timestamp"
          python3 scripts/dragonkernel/package_dac_module.py \
            --binary out/dragon-dac --output-dir out/b --timestamp "$timestamp"
          cmp out/a/*.zip out/b/*.zip
          (cd out/a && sha256sum -c *.sha256)
          python3 scripts/dragonkernel/validate_dac_module.py \
            --zip out/a/*.zip --checksum out/a/*.sha256
          cp out/a/*.zip out/a/*.sha256 out/
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: dac-module
          path: |
            out/UMI_*_DAC_Module_Build.zip
            out/UMI_*_DAC_Module_Build.zip.sha256
          if-no-files-found: error
