name: Fast targeted validation build

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device
        required: true
        type: choice
        options: [umi, cmi, cas, thyme, apollo]
      variant:
        description: Kernel variant
        required: true
        type: choice
        options: [original, kernelsu, sukisu]

permissions:
  contents: read

jobs:
  build:
    name: fast-${{ inputs.variant }}-${{ inputs.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      USE_CCACHE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set output directory
        run: echo "OUT_ROOT=$RUNNER_TEMP/dragonkernel-out" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: bash scripts/dragonkernel/bootstrap_wsl.sh

      - name: Fetch locked toolchain
        shell: bash
        run: scripts/dragonkernel/prepare_toolchain.sh "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Restore compiler cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: dragonkernel-ccache-v1-${{ runner.os }}-${{ inputs.variant }}-${{ inputs.device }}-${{ github.sha }}
          restore-keys: |
            dragonkernel-ccache-v1-${{ runner.os }}-${{ inputs.variant }}-${{ inputs.device }}-

      - name: Prepare selected Root integration
        if: inputs.variant != 'original'
        shell: bash
        run: |
          if [[ "${{ inputs.variant }}" == kernelsu ]]; then
            scripts/dragonkernel/prepare_susfs.sh
          else
            scripts/dragonkernel/prepare_sukisu.sh
          fi

      - name: Apply locked BBG hardening patch
        run: scripts/dragonkernel/prepare_bbg.sh

      - name: Build selected kernel
        run: scripts/dragonkernel/build_kernel.sh "${{ inputs.variant }}" "${{ inputs.device }}"

      - name: Fetch locked flashable template
        run: scripts/dragonkernel/prepare_anykernel3.sh "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Package flashable candidate
        shell: bash
        run: |
          output="$OUT_ROOT/${{ inputs.variant }}/${{ inputs.device }}"
          python3 scripts/dragonkernel/package_anykernel.py \
            "${{ inputs.device }}" "${{ inputs.variant }}" \
            "$ANYKERNEL3_DIR" "$output" "$output/flashable-candidate.zip"
          (cd "$output" && sha256sum flashable-candidate.zip > flashable-candidate.zip.sha256)

      - name: Upload validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fast-${{ inputs.variant }}-${{ inputs.device }}-${{ github.sha }}
          path: |
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/.config
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/include/config/kernel.release
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/SHA256SUMS
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/build.log
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/flashable-candidate.zip
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/flashable-candidate.zip.sha256
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/arch/arm64/boot/Image
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/arch/arm64/boot/dts/**/*.dtb
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/arch/arm64/boot/dts/**/*.dtbo
            ${{ env.OUT_ROOT }}/${{ inputs.variant }}/${{ inputs.device }}/**/*.ko
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
