name: Project contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      SHELL_SCRIPTS: >-
        scripts/dragonkernel/bootstrap_wsl.sh
        scripts/dragonkernel/build_kernel.sh
        scripts/dragonkernel/build_original.sh
        scripts/dragonkernel/build_kernelsu.sh
        scripts/dragonkernel/build_sukisu.sh
        scripts/dragonkernel/prepare_toolchain.sh
        scripts/dragonkernel/prepare_susfs.sh
        scripts/dragonkernel/prepare_sukisu.sh
        scripts/dragonkernel/prepare_avbtool.sh
        scripts/dragonkernel/prepare_magiskboot.sh
        scripts/dragonkernel/repack_boot.sh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            Documentation/dragonkernel
            scripts/dragonkernel
            patches/susfs
            patches/sukisu
            Makefile
            arch/arm64/configs/vendor
          sparse-checkout-cone-mode: false
      - run: python3 scripts/dragonkernel/verify_baseline.py
      - run: python3 scripts/dragonkernel/release_name.py --self-test
      - run: python3 scripts/dragonkernel/refresh_avb_footer.py --self-test
      - run: bash -n $SHELL_SCRIPTS
      - run: |
          for script in $SHELL_SCRIPTS scripts/dragonkernel/release_name.py scripts/dragonkernel/refresh_avb_footer.py; do
            test -x "$script"
          done
