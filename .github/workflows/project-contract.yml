name: Project contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            Documentation/dragonkernel
            scripts/dragonkernel
            patches/susfs
            patches/sukisu
            Makefile
            arch/arm64/configs/vendor
          sparse-checkout-cone-mode: false
      - run: python3 scripts/dragonkernel/verify_baseline.py
      - run: python3 scripts/dragonkernel/release_name.py --self-test
      - run: python3 scripts/dragonkernel/refresh_avb_footer.py --self-test
      - run: bash -n scripts/dragonkernel/bootstrap_wsl.sh scripts/dragonkernel/build_kernel.sh scripts/dragonkernel/build_original.sh scripts/dragonkernel/build_kernelsu.sh scripts/dragonkernel/build_sukisu.sh scripts/dragonkernel/prepare_susfs.sh scripts/dragonkernel/prepare_sukisu.sh scripts/dragonkernel/prepare_avbtool.sh scripts/dragonkernel/prepare_magiskboot.sh scripts/dragonkernel/repack_boot.sh
      - run: test -x scripts/dragonkernel/bootstrap_wsl.sh && test -x scripts/dragonkernel/build_kernel.sh && test -x scripts/dragonkernel/build_original.sh && test -x scripts/dragonkernel/build_kernelsu.sh && test -x scripts/dragonkernel/build_sukisu.sh && test -x scripts/dragonkernel/prepare_susfs.sh && test -x scripts/dragonkernel/prepare_sukisu.sh && test -x scripts/dragonkernel/prepare_avbtool.sh && test -x scripts/dragonkernel/prepare_magiskboot.sh && test -x scripts/dragonkernel/repack_boot.sh && test -x scripts/dragonkernel/release_name.py && test -x scripts/dragonkernel/refresh_avb_footer.py
