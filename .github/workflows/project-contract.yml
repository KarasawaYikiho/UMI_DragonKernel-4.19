name: Project contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    env:
      SHELL_SCRIPTS: >-
        scripts/dragonkernel/bootstrap_wsl.sh
        scripts/dragonkernel/build_kernel.sh
        scripts/dragonkernel/build_original.sh
        scripts/dragonkernel/build_kernelsu.sh
        scripts/dragonkernel/build_sukisu.sh
        scripts/dragonkernel/prepare_toolchain.sh
        scripts/dragonkernel/prepare_susfs.sh
        scripts/dragonkernel/prepare_sukisu.sh
        scripts/dragonkernel/prepare_bbg.sh
        scripts/dragonkernel/prepare_avbtool.sh
        scripts/dragonkernel/prepare_magiskboot.sh
        scripts/dragonkernel/prepare_payload_dumper.sh
        scripts/dragonkernel/prepare_anykernel3.sh
        scripts/dragonkernel/prepare_rom_boot.sh
        scripts/dragonkernel/repack_boot.sh
        scripts/dragonkernel/validate_rom_artifact.sh
        scripts/dragonkernel/validate_magisk_artifact.sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            .github
            Documentation/dragonkernel
            scripts/dragonkernel
            tools/dragon-dac
            patches/susfs
            patches/sukisu
            patches/bbg
            Makefile
            arch/arm64/configs/vendor
            arch/arm64/boot/dts/vendor/qcom/xiaomi-sm8250-common.dtsi
            drivers/power/supply/qcom/bq27z561_fg.c
            drivers/power/supply/qcom/fg-core.h
            drivers/power/supply/qcom/qpnp-fg-gen4.c
            drivers/power/supply/qcom_cas/bq27z561_fg.c
            drivers/cpufreq/cpu-boost.c
            drivers/baseband-guard
            drivers/Makefile
            drivers/Kconfig
            drivers/thermal/cpu_cooling.c
            drivers/thermal/thermal_core.c
            include/linux/cpu_cooling.h
            kernel/gen_kheaders.sh
            kernel/sched/boost.c
            kernel/sched/cpufreq_schedutil.c
          sparse-checkout-cone-mode: false
      - run: python3 scripts/dragonkernel/verify_baseline.py
      - run: python3 scripts/dragonkernel/release_name.py --self-test
      - run: python3 scripts/dragonkernel/diagnostics/capture_runtime.py --self-test
      - run: python3 scripts/dragonkernel/package_dac_module.py --self-test
      - run: python3 scripts/dragonkernel/validate_dac_module.py --self-test
      - run: python3 scripts/dragonkernel/refresh_avb_footer.py --self-test
      - run: python3 scripts/dragonkernel/package_anykernel.py --self-test
      - run: scripts/dragonkernel/validate_magisk_artifact.sh --self-test
      - run: bash -n $SHELL_SCRIPTS
      - run: |
          for script in $SHELL_SCRIPTS scripts/dragonkernel/release_name.py scripts/dragonkernel/refresh_avb_footer.py scripts/dragonkernel/package_anykernel.py; do
            test -x "$script"
          done
