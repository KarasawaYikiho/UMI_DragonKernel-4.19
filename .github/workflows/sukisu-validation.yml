name: SukiSU validation build

on:
  push:
    paths:
      - ".github/workflows/sukisu-validation.yml"
      - "arch/arm64/configs/vendor/**"
      - "drivers/**"
      - "patches/sukisu/**"
      - "patches/susfs/kernel-4.19.patch"
      - "scripts/dragonkernel/**"
      - "Documentation/dragonkernel/baseline.json"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: sukisu-${{ matrix.device }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: [umi, cmi, cas, thyme, apollo]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set output directory
        run: echo "OUT_ROOT=$RUNNER_TEMP/dragonkernel-out" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: bash scripts/dragonkernel/bootstrap_wsl.sh

      - name: Fetch locked toolchain
        shell: bash
        run: |
          name=$(python3 -c 'import json; print(json.load(open("Documentation/dragonkernel/baseline.json"))["toolchain"]["name"])')
          url=$(python3 -c 'import json; print(json.load(open("Documentation/dragonkernel/baseline.json"))["toolchain"]["url"])')
          ref=$(python3 -c 'import json; print(json.load(open("Documentation/dragonkernel/baseline.json"))["toolchain"]["ref"])')
          commit=$(python3 -c 'import json; print(json.load(open("Documentation/dragonkernel/baseline.json"))["toolchain"]["commit"])')
          toolchain="$RUNNER_TEMP/$name"
          git clone --depth=1 --single-branch --branch "$ref" "$url" "$toolchain"
          test "$(git -C "$toolchain" rev-parse HEAD)" = "$commit"
          echo "TOOLCHAIN_DIR=$toolchain" >> "$GITHUB_ENV"

      - name: Apply locked SukiSU and SUSFS patches
        run: scripts/dragonkernel/prepare_sukisu.sh

      - name: Build SukiSU kernel
        run: scripts/dragonkernel/build_sukisu.sh "${{ matrix.device }}"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: sukisu-${{ matrix.device }}-${{ github.sha }}
          path: |
            ${{ env.OUT_ROOT }}/sukisu/${{ matrix.device }}/.config
            ${{ env.OUT_ROOT }}/sukisu/${{ matrix.device }}/SHA256SUMS
            ${{ env.OUT_ROOT }}/sukisu/${{ matrix.device }}/build.log
            ${{ env.OUT_ROOT }}/sukisu/${{ matrix.device }}/arch/arm64/boot/Image
            ${{ env.OUT_ROOT }}/sukisu/${{ matrix.device }}/arch/arm64/boot/dts/**/*.dtb
            ${{ env.OUT_ROOT }}/sukisu/${{ matrix.device }}/arch/arm64/boot/dts/**/*.dtbo
            ${{ env.OUT_ROOT }}/sukisu/${{ matrix.device }}/**/*.ko
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
